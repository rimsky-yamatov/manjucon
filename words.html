<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>満州語 単語一覧</title>
<style>
@font-face{font-family:"ManchuFont";src:local("Mongolian Baiti"),local("MongolianBaiti"),url("monbaiti.ttf")}
:root{--fg:#1c1c1a;--mut:#5f5e5a;--line:#c8c6bc;--bg:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#f1efe8;--mut:#b4b2a9;--line:#55544f;--bg:#1c1c1a}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans CJK JP",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto}
h1{font-size:18px;font-weight:400;margin:0 0 4px}
.nav{font-size:12px;margin:0 0 12px}.nav a{color:var(--mut)}
input[type=search]{width:100%;box-sizing:border-box;padding:8px;font-size:16px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:0}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.cats button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:0;cursor:pointer}
.cats button.on{border-color:var(--fg);color:var(--fg)}
h2{font-size:15px;font-weight:400;margin:22px 0 0;padding-bottom:4px;border-bottom:1.5px solid var(--fg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr)}
.w{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--line);min-height:70px}
.m{font-family:"ManchuFont","Mongolian Baiti","Noto Sans Mongolian","Menksoft Qagan",serif;writing-mode:vertical-lr;font-size:26px;line-height:1.2;min-width:34px}
.t b{font-weight:500;font-size:15px;display:block}
.t span{font-size:12px;color:var(--mut)}
#n{font-size:12px;color:var(--mut);margin-top:8px}
</style></head><body><main>
<h1>満州語 単語一覧</h1>
<div class="nav"><a href="index.html">入門トップ</a>　<a href="converter.html">変換ツール</a></div>
<input type="search" id="q" placeholder="ローマ字または日本語で検索" spellcheck="false">
<div class="cats" id="cats"></div>
<div id="n"></div><div id="list"></div>
<script>
var M={a:"\u1820",e:"\u185D",i:"\u1873",o:"\u1823",u:"\u1860","ū":"\u1861",n:"\u1828",k:"\u1874",g:"\u1864",h:"\u1865",b:"\u182A",p:"\u1866",s:"\u1830","š":"\u1867",t:"\u1868",d:"\u1869",l:"\u182F",m:"\u182E",c:"\u1834",j:"\u1835",y:"\u1836",r:"\u1837",f:"\u1876",w:"\u1838",ng:"\u1829"};
function conv(s){var o="",i=0;while(i<s.length){var t=s.substr(i,2);if(t==="ng"){o+=M.ng;i+=2}else{o+=M[s[i]]||"";i++}}return o}
var D=[
["代名詞・助詞","bi 私;si 君;tere あれ・彼;ere これ;muse 我々（聞き手を含む）;be 我々（聞き手を含まない）／〜を;mini 私の;sini 君の;terei 彼の;i 〜の;ni 〜の（母音の後）;de 〜に・〜で;ci 〜から;ya どれ・誰;ai 何;ainu なぜ"],
["家族・人","niyalma 人;haha 男;hehe 女;ama 父;eniye 母;mafa 祖父;mama 祖母;ahun 兄;deo 弟;non 妹;sargan 妻;jui 子;haha jui 息子;sargan jui 娘;hojihon 婿;sakda 老人;asihan 若者;irgen 民;geren 衆;ejen 主人;han 汗;amban 大臣;hafan 官;baturu 勇者;mergen 賢い人"],
["体","beye 体;uju 頭;cira 顔;yasa 目;šan 耳;oforo 鼻;angga 口;weihe 歯;funiyehe 髪;hefeli 腹;gala 手;bethe 足;yali 肉;giranggi 骨;senggi 血;ergen 命;mujilen 心"],
["自然","abka 天;na 地;šun 太陽;biya 月;usiha 星;tugi 雲;edun 風;aga 雨;nimanggi 雪;gecen 霜;juhe 氷;akjan 雷;talkiyan 稲妻;tuwa 火;muke 水;alin 山;bira 川;mederi 海;omo 湖;moo 木;bigan 野;tala 野原;jugūn 道"],
["動物","morin 馬;ihan 牛;honin 羊;indahūn 犬;ulgiyan 豚;coko 鶏;tasha 虎;arsalan 獅子;lefu 熊;niohe 狼;dobi 狐;gūlmahūn 兎;ulhūma 雉;gaha 烏;saksaha 鵲;niongniyaha 雁;nimaha 魚;meihe 蛇;muduri 龍;singgeri 鼠"],
["数","emu 一;juwe 二;ilan 三;duin 四;sunja 五;ninggun 六;nadan 七;jakūn 八;uyun 九;juwan 十;orin 二十;gūsin 三十;dehi 四十;susai 五十;ninju 六十;nadanju 七十;jakūnju 八十;uyunju 九十;tanggū 百;minggan 千;tumen 万"],
["色・方角・季節","fulgiyan 赤;suwayan 黄;lamun 青;niowanggiyan 緑;šanyan 白;sahaliyan 黒;dergi 東;wargi 西;julergi 南;amargi 北;niyengniyeri 春;juwari 夏;bolori 秋;tuweri 冬"],
["時間","inenggi 日・昼;dobori 夜;erde 朝;yamji 夕;aniya 年;sikse 昨日;cimari 明日;nenehe 以前の;amaga 後の"],
["場所・物","boo 家;duka 門;hoton 城;gašan 村;gurun 国;ba 所;dorgi 内;tulergi 外;sejen 車;jahūdai 船;loho 刀;beri 弓;sirdan 矢;gūsa 旗;bithe 書物・文字;gisun 言葉;hūsun 力;hūwa 庭;hūturi 福;hūlha 盗賊"],
["食べ物","buda 飯;handu 稲・米;ufa 粉;sogi 野菜;nure 酒;cai 茶;mucen 鍋;jancuhūn 甘い;jušuhun 酸っぱい"],
["形容詞","amba 大きい;ajige 小さい;sain 良い;ehe 悪い;labdu 多い;komso 少ない;den 高い;fangkala 低い;goro 遠い;hanci 近い;ujen 重い;weihuken 軽い;halhūn 熱い;šahūrun 寒い;mangga 難しい・強い;elhe 平和;inu 正しい・そうだ;waka 違う;wesihun 貴い;fusihūn 卑しい;sebjen 楽しい"],
["動詞（辞書形）","bimbi いる・ある;jimbi 来る;genembi 行く;sambi 知る;ulhimbi 理解する;tuwambi 見る;donjimbi 聞く;gisurembi 話す;jembi 食べる;omimbi 飲む;banjimbi 生きる・生まれる;bahambi 得る;bumbi 与える;gaimbi 取る;sembi 言う;arambi 作る・書く;hūlambi 読む・呼ぶ;tacimbi 学ぶ;ilimbi 立つ;tembi 座る;dosimbi 入る;tucimbi 出る;yabumbi 行く・行う;feliyembi 歩く;ushambi 怒る;urgunjembi 喜ぶ;fonjimbi 尋ねる;jabumbi 答える;mutembi できる;buyembi 愛する;baimbi 求める;ejembi 記す"]
];
var all=[];D.forEach(function(c){c[1].split(";").forEach(function(x){var i=x.indexOf(" ");all.push({c:c[0],r:x.slice(0,i),j:x.slice(i+1)})})});
var cur="全部",q="";
var cats=["全部"].concat(D.map(function(c){return c[0]}));
var ce=document.getElementById("cats");
cats.forEach(function(n){var b=document.createElement("button");b.textContent=n;b.onclick=function(){cur=n;draw()};ce.appendChild(b)});
function draw(){
 Array.prototype.forEach.call(ce.children,function(b){b.className=b.textContent===cur?"on":""});
 var h="",n=0;
 D.forEach(function(c){
  if(cur!=="全部"&&cur!==c[0])return;
  var ws=all.filter(function(w){return w.c===c[0]&&(!q||w.r.indexOf(q)>=0||w.j.indexOf(q)>=0)});
  if(!ws.length)return;n+=ws.length;
  h+="<h2>"+c[0]+"</h2><div class='grid'>"+ws.map(function(w){return "<div class='w'><span class='m'>"+conv(w.r)+"</span><div class='t'><b>"+w.r+"</b><span>"+w.j+"</span></div></div>"}).join("")+"</div>";
 });
 document.getElementById("list").innerHTML=h;
 document.getElementById("n").textContent=n+" 語";
}
document.getElementById("q").addEventListener("input",function(){q=this.value.trim().toLowerCase();draw()});
draw();
</script></main></body></html>
