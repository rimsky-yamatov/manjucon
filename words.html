<style>
@font-face{font-family:"ManchuFont";src:local("Mongolian Baiti"),local("MongolianBaiti"),url("monbaiti.ttf")}
:root{--fg:#1c1c1a;--mut:#5f5e5a;--line:#c8c6bc;--bg:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#f1efe8;--mut:#b4b2a9;--line:#55544f;--bg:#1c1c1a}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans CJK JP",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto}
h1{font-size:18px;font-weight:400;margin:0 0 4px}
.nav{font-size:12px;margin:0 0 12px}.nav a{color:var(--mut)}
input[type=search]{width:100%;box-sizing:border-box;padding:8px;font-size:16px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:0}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}

.cats button.on{border-color:var(--fg);color:var(--fg)}
h2{font-size:15px;font-weight:400;margin:22px 0 0;padding-bottom:4px;border-bottom:1.5px solid var(--fg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr)}
.w{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--line);min-height:70px}
.m{font-family:"ManchuFont","Mongolian Baiti","Noto Sans Mongolian","Menksoft Qagan",serif;writing-mode:vertical-lr;font-size:26px;line-height:1.2;min-width:34px}
.t b{font-weight:500;font-size:15px;display:block}
.t span{font-size:12px;color:var(--mut)}
.grid.one{grid-template-columns:1fr}.ph .m{max-height:220px;font-size:22px;min-width:0}.ph .t{padding-top:2px}
p.nt{font-size:12px;color:var(--mut);margin:0}
#n{font-size:12px;color:var(--mut);margin-top:8px}
</style></head><body><main>

<p class="nt">「作例」と書いた見出しの文・句は、基本文法に沿って組んだ例です。実際の文献の引用ではないので、使う前に辞書や文法書で確かめてください。「elhe be fonjimbi」など定型的な言い方も同様です。</p>

<script>
var M={a:"\u1820",e:"\u185D",i:"\u1873",o:"\u1823",u:"\u1860","ū":"\u1861",n:"\u1828",k:"\u1874",g:"\u1864",h:"\u1865",b:"\u182A",p:"\u1866",s:"\u1830","š":"\u1867",t:"\u1868",d:"\u1869",l:"\u182F",m:"\u182E",c:"\u1834",j:"\u1835",y:"\u1836",r:"\u1837",f:"\u1876",w:"\u1838",ng:"\u1829"};
function conv(s){var o="",i=0;while(i<s.length){var t=s.substr(i,2);if(t==="ng"){o+=M.ng;i+=2}else{o+=M[s[i]]!==undefined?M[s[i]]:(s[i]===" "?" ":"");i++}}return o}
var D=[
["代名詞・助詞","bi 私;si 君;tere あれ・彼;ere これ;muse 我々（聞き手を含む）;be 我々（聞き手を含まない）／〜を;mini 私の;sini 君の;terei 彼の;i 〜の;ni 〜の（母音の後）;de 〜に・〜で;ci 〜から;ya どれ・どの;we 誰;ai 何;ainu なぜ;absi どのように;udu いくつ・いくら"],

["形容詞","amba 大きい;ajige 小さい;sain 良い;ehe 悪い;labdu 多い;komso 少ない;den 高い;fangkala 低い;goro 遠い;hanci 近い;ujen 重い;weihuken 軽い;halhūn 熱い;šahūrun 寒い;mangga 難しい・強い;elhe 平和;inu 正しい・そうだ;waka 違う;wesihun 貴い;fusihūn 卑しい;sebjen 楽しい"],
["動詞（辞書形）","bimbi いる・ある;jimbi 来る;genembi 行く;sambi 知る;ulhimbi 理解する;tuwambi 見る;donjimbi 聞く;gisurembi 話す;jembi 食べる;omimbi 飲む;banjimbi 生きる・生まれる;bahambi 得る;bumbi 与える;gaimbi 取る;sembi 言う;arambi 作る・書く;hūlambi 読む・呼ぶ;tacimbi 学ぶ;ilimbi 立つ;tembi 座る;dosimbi 入る;tucimbi 出る;yabumbi 行く・行う;feliyembi 歩く;ushambi 怒る;urgunjembi 喜ぶ;fonjimbi 尋ねる;jabumbi 答える;mutembi できる;buyembi 愛する;baimbi 求める;ejembi 覚える・記す"]
,["副詞・接続詞","ambula とても;umai まったく（否定と）;yala 本当に;mujangga まことに;uthai すぐに;hūdun 速く;elhe ゆっくり・安らか;daruhai いつも;kemuni まだ・なお;damu ただ・だけ;gemu すべて;yooni ことごとく;dahūme 再び;jai そして・次に;bime かつ;aika もし;oci 〜ならば;ofi 〜なので;seme と（引用）;tuttu そのように;uttu このように;turgun 理由;akū ない・〜ない;te 今;teni そこで初めて"],
["日常の名詞","gebu 名;se 年齢;jaka 物;hacin 種類・項目;baita 事・用事;mudan 回;erin 時;fon 時節;jilgan 声;menggun 銀・お金;aisin 金;boode 家で;gūnin 考え"],
["日常の動詞（追加）","amgambi 眠る;getembi 目覚める;bederembi 帰る;alambi 告げる;wesimbi 上る;wasimbi 下りる;sabumbi 見える;gūnimbi 思う;udambi 買う;uncambi 売る;injembi 笑う;songgombi 泣く;sebjelembi 楽しむ;jobošombi 心配する;gosimbi いつくしむ;yuyumbi 飢える;ebimbi 満腹する;wajimbi 終わる;mohombi 尽きる;sonjombi 選ぶ;sarašambi 宴を楽しむ;hendumbi 言う;ekšimbi 急ぐ;baibumbi 必要とする"],
["挨拶・感謝・返事（作例を含む）","baniha|ありがとう（感謝）;ambula baniha|大変ありがとう;elhe be fonjimbi|ご機嫌をうかがう（定型的な言い方）;elhe taifin|平和・泰平;sain|よろしい・良い;inu|はい・そうだ;waka|いいえ・違う;ombi|よい・かまわない;ojorakū|いけない・だめだ;mujangga|まことに・その通り;yala|本当に;bi sambi|私は知っている;bi sarkū|私は知らない;bi ulhimbi|私は分かる;bi ulhirakū|私は分からない;baiburakū|必要ない"],
["命令・依頼（作例を含む）","jio|来い・おいで;gene|行け;tuwa|見よ;donji|聞け;gisure|話せ;te|座れ;tesu|どうぞお座りください;gaisu|どうぞお取りください;ili|立て;je|食べよ;omi|飲め;bu|与えよ;ume ekšire|急ぐな;ume gisurere|話すな;ume jobošoro|心配するな"],
["質問（作例を含む）","ere ai|これは何か;tere ai|あれは何か;si we|君は誰か;sini gebu ai|君の名は何か;udu se oho|何歳になったか;ere udu|これはいくらか;ere udu menggun|これは銀いくらか;si ya bade bi|君はどこにいるか;si ya bai niyalma|君はどこの人か;ere be ainambi|これをどうするか;ainu uttu|なぜこうなのか;absi|どのように"],
["自己紹介・日常の文（作例）","bi manju niyalma|私は満洲人です;mini gebu Nurhaci sembi|私の名はヌルハチという（名を入れ替えて使う）;bi manju gisun be tacimbi|私は満州語を学ぶ;bi manju bithe be hūlambi|私は満州文字の書を読む;bi manju bithe be arambi|私は満州文字を書く;bi boode bi|私は家にいる;bi boode bederembi|私は家に帰る;bi buda jembi|私は飯を食べる;bi cai omimbi|私は茶を飲む;bi amgambi|私は眠る;bi genembi|私は行く;bi jimbi|私は来る;bi yuyumbi|私は腹が減った;ere sain|これは良い;tere ehe|あれは悪い;ere amba|これは大きい;ere inenggi sain|今日は良い日だ;ere inenggi šahūrun|今日は寒い;ere inenggi halhūn|今日は暑い;sikse aga agaha|昨日雨が降った;cimari nimanggi nimarambi|明日雪が降る;mini mujilen sebjen|私の心は楽しい"]
];
var all=[];D.forEach(function(c){c[1].split(";").forEach(function(x){var ph=x.indexOf("|")>=0,i=ph?x.indexOf("|"):x.indexOf(" ");all.push({c:c[0],r:x.slice(0,i),j:x.slice(i+1),p:ph})})});
var cur="全部",q="";
var cats=["全部"].concat(D.map(function(c){return c[0]}));
var ce=document.getElementById("cats");
cats.forEach(function(n){var b=document.createElement("button");b.textContent=n;b.onclick=function(){cur=n;draw()};ce.appendChild(b)});
function draw(){
 Array.prototype.forEach.call(ce.children,function(b){b.className=b.textContent===cur?"on":""});
 var h="",n=0;
 D.forEach(function(c){
  if(cur!=="全部"&&cur!==c[0])return;
  var ws=all.filter(function(w){return w.c===c[0]&&(!q||w.r.indexOf(q)>=0||w.j.indexOf(q)>=0)});
  if(!ws.length)return;n+=ws.length;
  h+="<h2>"+c[0]+"</h2><div class='grid"+(ws[0].p?" one":"")+"'>"+ws.map(function(w){return "<div class='w"+(w.p?" ph":"")+"'><span class='m'>"+conv(w.r)+"</span><div class='t'><b>"+w.r+"</b><span>"+w.j+"</span></div></div>"}).join("")+"</div>";
 });
 document.getElementById("list").innerHTML=h;
 document.getElementById("n").textContent=n+" 語";
}
document.getElementById("q").addEventListener("input",function(){q=this.value.trim().toLowerCase();draw()});
draw();
</script></main></body></html>
