<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メレンドルフ → 満州文字（縦書き）</title>
<style>
@font-face{font-family:"ManchuFont";src:local("Mongolian Baiti"),local("MongolianBaiti")}
:root{--fg:#1c1c1a;--mut:#5f5e5a;--line:#c8c6bc;--bg:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#f1efe8;--mut:#b4b2a9;--line:#55544f;--bg:#1c1c1a}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans CJK JP",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto}
h1{font-size:18px;font-weight:400;margin:0 0 12px}
textarea{width:100%;box-sizing:border-box;height:84px;font-size:16px;padding:8px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:0;font-family:inherit}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:10px 0;font-size:13px;color:var(--mut)}
.row label{display:flex;align-items:center;gap:6px}
button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--fg);background:transparent;color:var(--fg);border-radius:0;cursor:pointer}
#out{border:1px solid var(--line);margin-top:6px;overflow-x:auto;padding:12px}
#vt{font-family:"ManchuFont","Mongolian Baiti","Noto Sans Mongolian","Menksoft Qagan",serif;writing-mode:vertical-lr;font-size:48px;line-height:1.3;height:360px;white-space:normal;word-break:keep-all}
#err{font-size:12px;color:#a32d2d;min-height:18px;margin-top:6px}
#raw{font-size:12px;color:var(--mut);word-break:break-all;margin-top:8px}
small{color:var(--mut);display:block;margin-top:14px;font-size:12px}
</style></head><body><main>
<h1>メレンドルフ → 満州文字（縦書き）</h1>
<textarea id="in" placeholder="例: manju gisun / bi sini gebu be sambi" spellcheck="false">manju gisun</textarea>
<div class="row">
<label>文字の大きさ <input type="range" id="fs" min="24" max="96" value="48"></label>
<label>1列の長さ <input type="range" id="h" min="160" max="800" value="360"></label>
<button id="cp">満州文字をコピー</button>
</div>
<div id="out"><div id="vt"></div></div>
<div id="err"></div>
<div id="raw"></div>
<small>対応する綴り：母音 a e i o u ū（ū は v でも入力可）／子音 n k g h b p s š（sh）t d l m c j y r f w ng／特殊字 ts dz ž（zh）。空白は語の区切りです。k' g' h' など上記以外の綴りは変換されず、下に表示されます。<br>
フォントは同梱していません。端末に満州文字対応のフォント（Mongolian Baiti、Noto Sans Mongolian など）が必要です。</small>
<script>
var M={a:"\u1820",e:"\u185D",i:"\u1873",o:"\u1823",u:"\u1860","ū":"\u1861",n:"\u1828",k:"\u1874",g:"\u1864",h:"\u1865",b:"\u182A",p:"\u1866",s:"\u1830","š":"\u1867",t:"\u1868",d:"\u1869",l:"\u182F",m:"\u182E",c:"\u1834",j:"\u1835",y:"\u1836",r:"\u1837",f:"\u1876",w:"\u1838",ng:"\u1829",ts:"\u186E",dz:"\u186F","ž":"\u1870"};
var AL={sh:"š",zh:"ž",v:"ū",uu:"ū"};
var KEYS=["ng","ts","dz","sh","zh","uu"];
function conv(src){
 var s=src.toLowerCase().replace(/\u0161/g,"š"),out="",bad=[],i=0;
 while(i<s.length){
  var ch=s[i];
  if(/\s/.test(ch)){out+=ch;i++;continue}
  var two=s.substr(i,2),key=null,len=1;
  if(KEYS.indexOf(two)>=0){key=two;len=2}
  else{key=ch}
  var k=AL[key]||key;
  if(M[k]){out+=M[k];i+=len}
  else{bad.push(ch);i++}
 }
 return {text:out,bad:bad};
}
var inp=document.getElementById("in"),vt=document.getElementById("vt");
function upd(){
 var r=conv(inp.value);
 vt.textContent=r.text;
 document.getElementById("raw").textContent=r.text?"Unicode: "+Array.from(r.text).map(function(c){return c.trim()?"U+"+c.codePointAt(0).toString(16).toUpperCase():"␣"}).join(" "):"";
 document.getElementById("err").textContent=r.bad.length?"変換できない文字: "+r.bad.join(" "):"";
 vt.style.fontSize=document.getElementById("fs").value+"px";
 vt.style.height=document.getElementById("h").value+"px";
}
["in","fs","h"].forEach(function(id){document.getElementById(id).addEventListener("input",upd)});
document.getElementById("cp").addEventListener("click",function(){
 var t=conv(inp.value).text,b=this;
 function ok(){b.textContent="コピーしました";setTimeout(function(){b.textContent="満州文字をコピー"},1200)}
 if(navigator.clipboard){navigator.clipboard.writeText(t).then(ok)}
 else{var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();ok()}
});
upd();
</script></main></body></html>
